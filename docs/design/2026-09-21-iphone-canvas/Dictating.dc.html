  <div style="flex-shrink: 0; padding-bottom: 8px;">
    <div style="display: flex; align-items: flex-end; justify-content: center; gap: 34px;">

      <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 9px; color: #FFFFFF;">

    <div style="height: 34px; display: flex; align-items: center; justify-content: center;">
      <span style="width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.32);"></span>
    </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { polish: true };
  }
  renderVals() {
    const on = this.state.polish;
    return {
      polishOn: on,
      togglePolish: () => this.setState({ polish: !on }),
      polishFill: on ? 'rgba(232,107,59,0.22)' : 'rgba(255,255,255,0.10)',
      polishStroke: on ? '#FF8A5C' : 'rgba(255,255,255,0.10)',
      polishInk: on ? '#FF8A5C' : 'rgba(255,255,255,0.85)',
      polishLabel: on ? '#FF8A5C' : 'rgba(255,255,255,0.72)'
    };
  }
}
</script>
