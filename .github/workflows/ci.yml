# CI for iChirp: README reference check, script self-checks, strict format lint, ChirpKit package tests, an unsigned
# iOS Simulator build of the app and its app-hosted tests, and the privacy manifest compared with the built app. Nothing
# here signs, archives or touches the Apple Developer account. The real-model test stays skipped (it runs only with
# CHIRP_MODEL_TESTS=1), so CI never downloads models.
# The Mac companion's tests run in their own workflow (companion.yml, only when companion/ changes).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # runner label unverified; use the newest macOS image with Xcode 26
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # Actions are pinned by commit, not by a tag that can move (R8-17): v4.4.0.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select the newest stable Xcode 26
        run: |
          # Skips betas and release candidates; keeps the image's default when there is no stable Xcode_26*.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      # XcodeGen is pinned by version and checked against the release's published sha256 (R8-17), so a new XcodeGen
      # cannot change the generated project under a green build. To bump it: take the new release's xcodegen.zip digest
      # (`gh api repos/yonaskolb/XcodeGen/releases/tags/<version> --jq '.assets[].digest'`), run scripts/gen.sh with it
      # locally, then change both values here.
      - name: Install XcodeGen 2.45.4
        env:
          XCODEGEN_VERSION: "2.45.4"
          XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          BIN=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Module README references
        run: scripts/check_readme_references.sh

      # The scripts' own logic: syntax under macOS's bash 3.2, the run_device.sh failure classifier, device selection,
      # bootstrap, the secret scanner's rules, the build stamp, and the privacy manifest checker's rules (proven on small
      # compiled test programs) plus the manifest against the sources. The vendored runtimes and the app do not exist yet
      # here; the manifest is compared with them in the last step, "Privacy manifest against the built app".
      - name: Script and manifest checks
        run: scripts/check_scripts.sh

      - name: Format lint
        run: swift format lint --strict --recursive ChirpKit/Sources App/Sources App/Shared Widgets

      # M6 (ADR-012): Needle 3's runtime from needle-rs source, so the tests and the app build cover ChirpEngineNeedle.
      - name: Build Needle runtime (needle-rs → vendor/NeedleC.xcframework)
        run: |
          command -v rustup >/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          scripts/build_needle.sh

      # M7 (ADR-015): llama.cpp from its pinned source release, so the tests and the app build cover
      # ChirpEngineLlamaCpp. The real-model test stays skipped (CHIRP_ONDEVICE_LLM_TESTS=1 only), so CI downloads no model.
      - name: Build llama.cpp runtime (llama.cpp → vendor/llama.xcframework)
        # Simulator and Mac slices only: CI never builds for an iPhone (review minor 13).
        env:
          LLAMA_BUILDS: ios-sim macos
        run: scripts/build_llamacpp.sh

      - name: ChirpKit package tests
        run: swift test --package-path ChirpKit

      - name: Generate iChirp.xcodeproj
        run: scripts/gen.sh

      # build-for-testing compiles the app AND its app-hosted tests (AppTests: the clinical-confirmation tests that keep
      # clinical text from leaving without the confirm button, the Keychain test, ...), so a break in them shows here
      # without booting a simulator. Running them stays in the documented final gate (scripts/test.sh): a simulator job
      # is not added until it is proven reliable on these runners (R8-5).
      # Package versions: the generated project has no committed Package.resolved, so this build resolves packages
      # itself. FluidAudio and WhisperKit are pinned exactly in ChirpKit/Package.swift; GRDB is a range (from 7.0.0), so
      # the app can link a newer GRDB than the tested ChirpKit/Package.resolved (docs/distribution.md).
      - name: Build the app and its tests for the iOS Simulator (unsigned)
        run: |
          xcodebuild build-for-testing \
            -project iChirp.xcodeproj \
            -scheme iChirp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # R8-22: the privacy manifest against what the built app imports. It reads every Mach-O file of the app, including
      # the statically linked Rust libraries (needle-c, and FluidAudio's NeMo text library) whose standard library imports
      # stat, fstat, lstat and fstatat, and `nm -u` of the vendored runtimes built above. A required-reason API that is
      # used but not declared in App/PrivacyInfo.xcprivacy fails here, not at App Store upload (ITMS-91053). It stays after
      # the builds because it reads their output; scripts/check_scripts.sh checks the order.
      - name: Privacy manifest against the built app
        run: scripts/check_privacy_manifest.sh --app .build/xcode/Build/Products/Debug-iphonesimulator/iChirp.app
