name: iChirp
options:
  bundleIdPrefix: com.aarzamen
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  ChirpKit: { path: ChirpKit }
targets:
  iChirp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: ChirpKit
        products: [ChirpCore, ChirpText, ChirpExport, ChirpStore, ChirpAudio, ChirpEngineFluidAudio, ChirpFeatures, ChirpUI]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIImageName: ParakeetArt
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: false
        # M1.5 Step 1: Parakeet appears in the Share sheet's app row for audio and video (Voice Memos, Files).
        # iOS copies the file into Documents/Inbox and calls .onOpenURL (RootTabView). No extension, no entitlement.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
        # M1.5 Step 2: BGContinuedProcessingTask identifiers, <bundle id>.<kind>.<UUID> (wildcard suffix, iOS 26).
        # No UIBackgroundModes and no entitlement: CPU/Neural Engine work needs neither; only background GPU would.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).transcribe.*
          - $(PRODUCT_BUNDLE_IDENTIFIER).download.*
        ChirpGitCommit: unknown
        ChirpGitBranch: unknown
        ChirpGitDirty: "0"
        ChirpBuildDateUTC: unknown
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp Build Identity
        script: "\"${SRCROOT}/scripts/stamp_build_identity.sh\""
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
  iChirpTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies: [{ target: iChirp }]
schemes:
  iChirp:
    build: { targets: { iChirp: all, iChirpTests: [test] } }
    test: { targets: [iChirpTests], gatherCoverageData: false }
    run: { config: Debug }
